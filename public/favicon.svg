<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E87A5D"/>
      <stop offset="50%" stop-color="#FF9F43"/>
      <stop offset="100%" stop-color="#E05638"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B17"/>
      <stop offset="100%" stop-color="#140E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Modern Rounded Icon Base -->
  <rect width="64" height="64" rx="15" fill="url(#bg-grad)"/>
  <rect width="64" height="64" rx="15" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>

  <!-- Outer Orbital Ellipse -->
  <ellipse cx="32" cy="32" rx="22" ry="10" transform="rotate(-28 32 32)" stroke="url(#orbit-grad)" stroke-width="3.2" stroke-linecap="round" opacity="0.95"/>

  <!-- Secondary Cross Orbital Ring -->
  <ellipse cx="32" cy="32" rx="22" ry="8.5" transform="rotate(38 32 32)" stroke="#FFFFFF" stroke-width="1.6" stroke-dasharray="3.5 3.5" opacity="0.45"/>

  <!-- Core Radiant Nucleus -->
  <circle cx="32" cy="32" r="6" fill="url(#orbit-grad)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" opacity="0.95"/>

  <!-- Orbiting Satellite Node -->
  <circle cx="49" cy="24" r="3.2" fill="#FFA502"/>
  <circle cx="49" cy="24" r="1.4" fill="#FFFFFF"/>
</svg>